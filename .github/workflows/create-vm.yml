name: Try to Create OCI VM

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟运行一次

jobs:
  oci-create-instance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install OCI CLI & jq
      run: |
        mkdir -p bin
        curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o bin/install.sh
        chmod +x bin/install.sh
        ./bin/install.sh --accept-all-defaults
        echo "/home/runner/bin" >> $GITHUB_PATH
        sudo apt-get install jq -y

    - name: Configure OCI CLI
      run: |
        mkdir -p ~/.oci
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
        echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
        echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
        echo "region=us-phoenix-1" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: Run Create Instance Script
      id: create_instance
      run: |
        export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=1
        
        echo "正在自动获取凤凰城真实可用区名称..."
        # 取出全部可用区的完整名字，逐个尝试
        AD_NAMES=$(oci iam availability-domain list --all | jq -r '.data[].name')
        echo "探测到可用区：$AD_NAMES"

        # 核心抢机命令：已手动写死凤凰城专属镜像和子网 ID；三个可用区轮流试，有一个成功就停
        RESPONSE=""
        for AD_NAME in $AD_NAMES; do
          echo "尝试可用区：$AD_NAME"
          RESPONSE=$(oci compute instance launch \
            --availability-domain "$AD_NAME" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "ocid1.subnet.oc1.phx.aaaaaaaafh4c5wf3uzbx4spkcipuqkpmxxrq5d2jcfr6o3oyt7nsxh7sgapq" \
            --image-id "ocid1.image.oc1.phx.aaaaaaaak5t5srbpi3g5utsri4rb6twcvnsuvzpsmllm6jybgg3upruvjydq" \
            --assign-public-ip true \
            --metadata "{\"ssh_authorized_keys\": \"${{ secrets.OCI_SSH_PUBLIC_KEY }}\"}" \
            --display-name "coolify-arm-vm" \
            --boot-volume-size-in-gbs 100 2>&1) || true
          if ! echo "$RESPONSE" | grep -qiE "out of (host )?capacity"; then
            break
          fi
        done

        echo "OCI_RESPONSE<<EOF" >> $GITHUB_ENV
        echo "$RESPONSE" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        if echo "$RESPONSE" | grep -qiE "out of (host )?capacity"; then
          echo "status=capacity_error" >> $GITHUB_OUTPUT
        elif echo "$RESPONSE" | grep -q "lifecycle-state"; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "========================================"
          echo "探测结果：$RESPONSE"
          echo "========================================"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Send Notification to Discord
      if: always()
      run: |
        RESPONSE_CLEANED=$(echo "$OCI_RESPONSE" | tr -d '"' | tr -d "'" | tr '\n' ' ')
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        if echo "$OCI_RESPONSE" | grep -qiE "out of (host )?capacity"; then
          COLOR=16753920 # 橙色
          TITLE="凤凰城巡逻报告 - 暂时无货"
          DESCRIPTION="所有配置已通过验证，机房暂时没有库存，脚本将持续每10分钟自动抢购一次。"
        elif echo "$OCI_RESPONSE" | grep -q "lifecycle-state"; then
          COLOR=65280 # 绿色
          TITLE="🎉 奇迹发生！凤凰城 ARM 已抢到！"
          DESCRIPTION="您的 2核12G 服务器已创建成功。请去后台查看，并立即禁用此 GitHub Actions。"
        else
          COLOR=16711680 # 红色
          TITLE="脚本配置异常"
          DESCRIPTION="检测到无法识别的报错，请检查 API 密钥或 Secrets 变量。"
        fi
        
        curl -s -o /dev/null -w "discord http %{http_code}\n" -H "Content-Type: application/json" \
             -X POST \
             -d "{\"embeds\": [{\"title\": \"$TITLE\", \"description\": \"$DESCRIPTION\", \"color\": $COLOR, \"fields\": [{\"name\": \"甲骨文回执\", \"value\": \"${RESPONSE_CLEANED:0:1020}\"}], \"timestamp\": \"$TIMESTAMP\"}]}" \
             "${{ secrets.DISCORD_WEBHOOK_URL }}"
